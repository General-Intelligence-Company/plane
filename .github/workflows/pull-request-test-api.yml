name: Test API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    name: API Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.requested_reviewers != null

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements/test.txt"

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements/test.txt

      - name: Run unit tests
        env:
          DATABASE_URL: postgres://plane:plane@localhost:5432/plane_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: plane.settings.test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd apps/api
          python -m pytest -m unit --reuse-db --nomigrations -v --tb=short

  test-api-contract:
    name: API Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.requested_reviewers != null

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements/test.txt"

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements/test.txt

      - name: Run contract tests
        env:
          DATABASE_URL: postgres://plane:plane@localhost:5432/plane_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: plane.settings.test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd apps/api
          python -m pytest -m contract --reuse-db --nomigrations -v --tb=short
