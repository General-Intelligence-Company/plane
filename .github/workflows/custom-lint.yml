name: Custom Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
      - "main"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  custom-lint:
    name: Custom Lint Rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
      - name: Run custom lint rules
        run: python apps/api/bin/custom_lint_rules.py apps/api/
