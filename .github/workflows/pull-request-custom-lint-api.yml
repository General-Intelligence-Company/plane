name: Custom Lint API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  custom-lint:
    name: Custom Lint Rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.requested_reviewers != null
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.x"

      - name: Run custom lint rules
        run: |
          cd apps/api
          find plane -name "*.py" -type f | xargs python scripts/custom_lint_rules.py
