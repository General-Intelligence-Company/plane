name: Build and lint API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.requested_reviewers != null
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'
      - name: Install Pylint
        run: python -m pip install ruff
      - name: Install API Dependencies
        run: cd apps/api && pip install -r requirements.txt
      - name: Lint apps/api with Ruff
        run: ruff check --config apps/api/pyproject.toml apps/api

      - name: Get changed Python files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD -- 'apps/api/**/*.py' | tr '\n' ' ')
          else
            files=$(find apps/api -name "*.py" -not -path "*/migrations/*" | tr '\n' ' ')
          fi
          echo "files=$files" >> $GITHUB_OUTPUT

      - name: Run custom lint rules
        if: steps.changed-files.outputs.files != ''
        run: python apps/api/scripts/custom_lint_rules.py ${{ steps.changed-files.outputs.files }}
